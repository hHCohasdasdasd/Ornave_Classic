services:
  - type: web
    name: ornave-backend
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: this service sets NODE_ENV=production below, which
    # makes plain `npm install` silently skip devDependencies (typescript,
    # @types/node, prisma CLI) — all required to build. `npm ci` installs
    # the exact versions in package-lock.json rather than re-resolving
    # against semver ranges, so the build uses the same typescript version
    # verified working locally instead of whatever is newest at build time.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRY
        value: 7d
      # Secrets — not stored in the repo. Render will prompt for these when
      # the blueprint is applied; fill them in from backend/.env locally
      # (DATABASE_URL/DIRECT_URL use the least-privilege ornave_app role,
      # not the Supabase superuser). CORS_ORIGIN should be a comma-separated
      # list including wherever the frontend actually runs (e.g.
      # http://localhost:5175 for now, plus its real origin once deployed).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
