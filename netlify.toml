[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy API calls through Netlify's own domain to the Render backend,
# instead of the browser talking to onrender.com directly. The backend's
# session cookie only works reliably if it's first-party — browsers
# (Chrome Incognito, Safari, Firefox private mode) increasingly block
# cookies set by a domain other than the one in the address bar, even with
# SameSite=None;Secure. Routing through this same-origin proxy makes the
# cookie first-party for the frontend's domain, sidestepping that entirely.
# Must come before the SPA catch-all below — first matching rule wins.
[[redirects]]
  from = "/api/*"
  to = "https://ornave-backend.onrender.com/api/:splat"
  status = 200
  force = true

# This is a client-side-routed React app (React Router). Without this,
# refreshing or deep-linking to any non-root path (e.g. /profile) 404s,
# since there's no actual file at that path on Netlify's static host —
# every path needs to fall back to index.html and let the router take over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
